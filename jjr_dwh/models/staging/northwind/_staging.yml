version: 2
models:
  - name: stg_customers
    tests:
      - not_null: {column_name: customer_id}
      - unique:   {column_name: customer_id}
  - name: stg_orders
    tests:
      - not_null: {column_name: order_id}
  - name: stg_order_details
    tests:
      - not_null: {column_name: order_id}
      - not_null: {column_name: product_id}
  - name: stg_products
    tests:
      - not_null: {column_name: product_id}
      - unique:   {column_name: product_id}
