version: 2
models:
  - name: dim_product
    tests:
      - not_null:
          arguments:
            column_name: product_key
      - unique:
          arguments:
            column_name: product_key

  - name: fct_order_items
    tests:
      - not_null:
          arguments:
            column_name: order_id
      - not_null:
          arguments:
            column_name: product_id
      - relationships:
          arguments:
            to: ref('dim_product')
            field: product_key        
            column_name: product_id   

  - name: dim_product_scd1
    tests:
      - not_null: { arguments: { column_name: product_key } }
      - unique:   { arguments: { column_name: product_key } }
  - name: dim_product_scd2
    tests:
      - not_null: { arguments: { column_name: product_sk } }
      - unique:   { arguments: { column_name: product_sk } }
      - not_null: { arguments: { column_name: product_bk } }

  - name: dim_product_scd2_current
    tests:
      - not_null: { arguments: { column_name: product_sk } }
      - unique:   { arguments: { column_name: product_sk } }